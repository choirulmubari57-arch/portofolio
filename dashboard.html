<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Kelola Proyek</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      #0c0c0e;
      --bg-2:    #111114;
      --bg-card: #161619;
      --border:  rgba(255,255,255,0.07);
      --text:    #e8e8e0;
      --dim:     #6b6b72;
      --muted:   #3a3a42;
      --accent:  #d4ff4e;
      --red:     #ff5f5f;
      --green:   #4eff9f;
      --mono:    'DM Mono', monospace;
      --sans:    'Syne', sans-serif;
      --r:       8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.5rem;
      background: rgba(12,12,14,0.95);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }
    .header__logo {
      font-family: var(--sans);
      font-size: 1rem; font-weight: 800;
      letter-spacing: -0.02em;
    }
    .header__logo span { color: var(--accent); }
    .header__meta {
      font-size: 0.68rem;
      color: var(--muted);
    }

    /* ── Layout ── */
    .container { padding: 1.5rem; max-width: 900px; margin: 0 auto; }

    /* ── Stats bar ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .stat-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 1rem;
    }
    .stat-box__num {
      font-family: var(--sans);
      font-size: 1.6rem; font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }
    .stat-box__label {
      font-size: 0.62rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.25rem;
    }

    /* ── Section header ── */
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem;
    }
    .section-head h2 {
      font-family: var(--sans);
      font-size: 0.9rem; font-weight: 700;
      letter-spacing: -0.01em;
    }
    .btn-add {
      display: flex; align-items: center; gap: 0.4rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      background: var(--accent); color: #000;
      border: none; border-radius: var(--r);
      padding: 0.45rem 0.9rem;
      cursor: pointer; font-weight: 500;
    }

    /* ── Project list ── */
    .project-list { display: flex; flex-direction: column; gap: 0.75rem; }

    .project-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 1rem;
      display: flex; gap: 0.75rem; align-items: flex-start;
      transition: border-color 0.2s;
    }
    .project-item:hover { border-color: rgba(255,255,255,0.15); }

    .project-item__thumb {
      width: 56px; height: 56px; flex-shrink: 0;
      border-radius: 6px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      object-fit: cover;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem; color: var(--muted);
      text-align: center; overflow: hidden;
    }
    .project-item__thumb img { width: 100%; height: 100%; object-fit: cover; }

    .project-item__info { flex: 1; min-width: 0; }
    .project-item__cat {
      font-size: 0.6rem; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    .project-item__title {
      font-family: var(--sans);
      font-size: 0.9rem; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin: 0.15rem 0;
    }
    .project-item__tags {
      display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.35rem;
    }
    .project-item__tags span {
      font-size: 0.6rem; padding: 0.1rem 0.4rem;
      border: 1px solid var(--border);
      border-radius: 3px; color: var(--dim);
    }

    .project-item__actions {
      display: flex; flex-direction: column; gap: 0.35rem; flex-shrink: 0;
    }
    .btn-edit, .btn-del {
      font-family: var(--mono); font-size: 0.65rem;
      border-radius: 5px; padding: 0.3rem 0.65rem;
      cursor: pointer; border: 1px solid;
    }
    .btn-edit {
      background: transparent;
      border-color: var(--border); color: var(--dim);
    }
    .btn-edit:hover { border-color: var(--accent); color: var(--accent); }
    .btn-del {
      background: transparent;
      border-color: rgba(255,95,95,0.2); color: var(--red);
    }
    .btn-del:hover { background: rgba(255,95,95,0.1); }

    /* ── Modal Form ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex; align-items: flex-end;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }

    .modal {
      width: 100%; max-height: 90vh;
      background: var(--bg-2);
      border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      padding: 1.5rem;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    .overlay.active .modal { transform: translateY(0); }

    .modal__handle {
      width: 36px; height: 4px;
      background: var(--muted); border-radius: 2px;
      margin: 0 auto 1.25rem;
    }
    .modal__title {
      font-family: var(--sans);
      font-size: 1.1rem; font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
    }
    .modal__title span { color: var(--accent); }

    /* ── Form ── */
    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block;
      font-size: 0.65rem; color: var(--dim);
      text-transform: uppercase; letter-spacing: 0.1em;
      margin-bottom: 0.4rem;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.82rem;
      padding: 0.6rem 0.8rem;
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus { border-color: var(--accent); }
    .form-group textarea { resize: vertical; min-height: 80px; }

    /* Tags input */
    .tags-input {
      display: flex; flex-wrap: wrap; gap: 0.35rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 0.5rem;
      cursor: text;
    }
    .tags-input:focus-within { border-color: var(--accent); }
    .tag-chip {
      display: flex; align-items: center; gap: 0.3rem;
      background: rgba(212,255,78,0.12);
      color: var(--accent);
      border: 1px solid rgba(212,255,78,0.2);
      border-radius: 4px;
      font-size: 0.65rem; padding: 0.15rem 0.45rem;
    }
    .tag-chip button {
      background: none; border: none;
      color: var(--accent); cursor: pointer;
      font-size: 0.7rem; line-height: 1;
      padding: 0;
    }
    .tags-input input {
      background: none; border: none;
      color: var(--text); font-family: var(--mono);
      font-size: 0.78rem; outline: none;
      min-width: 80px; flex: 1; padding: 0.1rem 0;
    }

    /* Foto preview */
    .foto-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .foto-preview {
      width: 70px; height: 70px;
      border-radius: 6px; border: 1px dashed var(--border);
      object-fit: cover; display: none;
    }
    .foto-preview.show { display: block; }
    .foto-placeholder {
      width: 70px; height: 70px;
      border-radius: 6px; border: 1px dashed var(--border);
      background: var(--bg-card);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem; color: var(--muted);
      text-align: center; cursor: pointer;
    }

    /* Submit */
    .modal__footer {
      display: flex; gap: 0.75rem; margin-top: 1.25rem;
    }
    .btn-cancel {
      flex: 1; font-family: var(--mono); font-size: 0.75rem;
      background: transparent; border: 1px solid var(--border);
      color: var(--dim); border-radius: var(--r);
      padding: 0.65rem; cursor: pointer;
    }
    .btn-save {
      flex: 2; font-family: var(--mono); font-size: 0.75rem;
      background: var(--accent); color: #000;
      border: none; border-radius: var(--r);
      padding: 0.65rem; cursor: pointer; font-weight: 500;
    }

    /* Toast */
    .toast {
      position: fixed; bottom: 1.5rem; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-card);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 0.75rem; padding: 0.6rem 1.25rem;
      border-radius: 2rem; white-space: nowrap;
      transition: transform 0.3s; z-index: 200;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Empty state */
    .empty {
      text-align: center; padding: 3rem 1rem;
      color: var(--muted); font-size: 0.8rem;
    }
    .empty span { font-size: 2rem; display: block; margin-bottom: 0.5rem; }

    /* Kategori badge warna */
    .cat-web    { color: #60a5fa; }
    .cat-data   { color: var(--accent); }
    .cat-webdata { color: var(--green); }
  </style>
</head>
<body>

  <header class="header">
    <div class="header__logo">[ <span>admin</span> ]</div>
    <div class="header__meta" id="headerMeta">0 proyek</div>
  </header>

  <div class="container">

    <!-- Stats -->
    <div class="stats">
      <div class="stat-box">
        <div class="stat-box__num" id="statTotal">0</div>
        <div class="stat-box__label">total proyek</div>
      </div>
      <div class="stat-box">
        <div class="stat-box__num" id="statWeb">0</div>
        <div class="stat-box__label">web dev</div>
      </div>
      <div class="stat-box">
        <div class="stat-box__num" id="statData">0</div>
        <div class="stat-box__label">otomasi data</div>
      </div>
    </div>

    <!-- List -->
    <div class="section-head">
      <h2>// daftar proyek</h2>
      <button class="btn-add" onclick="bukaForm()">+ tambah</button>
    </div>
    <div class="project-list" id="projectList"></div>

  </div>

  <!-- Modal Form -->
  <div class="overlay" id="overlay" onclick="tutupJikaLuar(event)">
    <div class="modal" id="modal">
      <div class="modal__handle"></div>
      <div class="modal__title" id="modalTitle">tambah <span>proyek</span></div>

      <div class="form-group">
        <label>nama proyek</label>
        <input type="text" id="fNama" placeholder="cth: web pesanan otomatis" />
      </div>

      <div class="form-group">
        <label>deskripsi</label>
        <textarea id="fDesc" placeholder="jelaskan proyekmu secara singkat..."></textarea>
      </div>

      <div class="form-group">
        <label>kategori</label>
        <select id="fKat">
          <option value="web">web development</option>
          <option value="data">otomasi data</option>
          <option value="webdata">web + data</option>
        </select>
      </div>

      <div class="form-group">
        <label>bahasa / teknologi (tekan Enter untuk tambah)</label>
        <div class="tags-input" id="tagsInput" onclick="document.getElementById('tagField').focus()">
          <input type="text" id="tagField" placeholder="cth: Python" />
        </div>
      </div>

      <div class="form-group">
        <label>foto utama</label>
        <input type="text" id="fFoto1" placeholder="assets/foto1.png" oninput="previewFoto(this, 'prev1')" />
        <div class="foto-row"><img id="prev1" class="foto-preview" /></div>
      </div>

      <div class="form-group">
        <label>foto tambahan (opsional)</label>
        <input type="text" id="fFoto2" placeholder="assets/foto2.png" oninput="previewFoto(this, 'prev2')" />
        <input type="text" id="fFoto3" placeholder="assets/foto3.png" style="margin-top:0.5rem" oninput="previewFoto(this, 'prev3')" />
        <input type="text" id="fFoto4" placeholder="assets/foto4.png" style="margin-top:0.5rem" oninput="previewFoto(this, 'prev4')" />
        <input type="text" id="fFoto5" placeholder="assets/foto5.png" style="margin-top:0.5rem" oninput="previewFoto(this, 'prev5')" />
        <div class="foto-row">
          <img id="prev2" class="foto-preview" />
          <img id="prev3" class="foto-preview" />
          <img id="prev4" class="foto-preview" />
          <img id="prev5" class="foto-preview" />
        </div>
      </div>

      <div class="form-group">
        <label>link demo (opsional)</label>
        <input type="text" id="fDemo" placeholder="https://..." />
      </div>

      <div class="form-group">
        <label>link github (opsional)</label>
        <input type="text" id="fGithub" placeholder="https://github.com/..." />
      </div>

      <div class="modal__footer">
        <button class="btn-cancel" onclick="tutupForm()">batal</button>
        <button class="btn-save" onclick="simpanProyek()">simpan_proyek()</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ── State ──
    let proyek = JSON.parse(localStorage.getItem('proyek') || '[]');
    let editIndex = -1;
    let tags = [];

    const katLabel = {
      web: 'web development',
      data: 'otomasi data',
      webdata: 'web + data'
    };
    const katClass = {
      web: 'cat-web',
      data: 'cat-data',
      webdata: 'cat-webdata'
    };

    // ── Render ──
    function render() {
      const list = document.getElementById('projectList');
      const total = proyek.length;
      const web   = proyek.filter(p => p.kat === 'web').length;
      const data  = proyek.filter(p => p.kat === 'data' || p.kat === 'webdata').length;

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statWeb').textContent   = web;
      document.getElementById('statData').textContent  = data;
      document.getElementById('headerMeta').textContent = `${total} proyek`;

      if (total === 0) {
        list.innerHTML = `<div class="empty"><span>📂</span>belum ada proyek.<br/>tekan "+ tambah" untuk mulai.</div>`;
        return;
      }

      list.innerHTML = proyek.map((p, i) => `
        <div class="project-item">
          <div class="project-item__thumb">
            ${p.foto1 ? `<img src="${p.foto1}" onerror="this.style.display='none'" />` : 'no foto'}
          </div>
          <div class="project-item__info">
            <div class="project-item__cat ${katClass[p.kat]}">${katLabel[p.kat]}</div>
            <div class="project-item__title">${p.nama}</div>
            <div class="project-item__tags">
              ${p.tags.map(t => `<span>${t}</span>`).join('')}
            </div>
          </div>
          <div class="project-item__actions">
            <button class="btn-edit" onclick="editProyek(${i})">edit</button>
            <button class="btn-del"  onclick="hapusProyek(${i})">hapus</button>
          </div>
        </div>
      `).join('');
    }

    // ── Form ──
    function bukaForm(mode = 'tambah') {
      document.getElementById('modalTitle').innerHTML =
        `${mode} <span>proyek</span>`;
      document.getElementById('overlay').classList.add('active');
    }

    function tutupForm() {
      document.getElementById('overlay').classList.remove('active');
      resetForm();
    }

    function tutupJikaLuar(e) {
      if (e.target === document.getElementById('overlay')) tutupForm();
    }

    function resetForm() {
      ['fNama','fDesc','fFoto1','fFoto2','fFoto3','fFoto4','fFoto5','fDemo','fGithub'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('fKat').value = 'web';
      tags = [];
      renderTags();
      document.getElementById('prev1').classList.remove('show');
      document.getElementById('prev2').classList.remove('show');
      document.getElementById('prev3').classList.remove('show');
      document.getElementById('prev4').classList.remove('show');
      document.getElementById('prev5').classList.remove('show');
      editIndex = -1;
    }

    function editProyek(i) {
      const p = proyek[i];
      editIndex = i;
      document.getElementById('fNama').value   = p.nama;
      document.getElementById('fDesc').value   = p.deskripsi;
      document.getElementById('fKat').value    = p.kat;
      document.getElementById('fFoto1').value  = p.foto1 || '';
      document.getElementById('fFoto2').value  = p.foto2 || '';
      document.getElementById('fFoto3').value  = p.foto3 || '';
      document.getElementById('fFoto4').value  = p.foto4 || '';
      document.getElementById('fFoto5').value  = p.foto5 || '';
      document.getElementById('fDemo').value   = p.demo || '';
      document.getElementById('fGithub').value = p.github || '';
      tags = [...p.tags];
      renderTags();
      previewFoto(document.getElementById('fFoto1'), 'prev1');
      previewFoto(document.getElementById('fFoto2'), 'prev2');
      previewFoto(document.getElementById('fFoto3'), 'prev3');
      previewFoto(document.getElementById('fFoto4'), 'prev4');
      previewFoto(document.getElementById('fFoto5'), 'prev5');
      bukaForm('edit');
    }

    function hapusProyek(i) {
      if (!confirm('Yakin hapus proyek ini?')) return;
      proyek.splice(i, 1);
      simpan();
      toast('proyek dihapus');
    }

    function simpanProyek() {
      const nama = document.getElementById('fNama').value.trim();
      if (!nama) { toast('nama proyek wajib diisi!'); return; }

      const data = {
        nama,
        deskripsi: document.getElementById('fDesc').value.trim(),
        kat:       document.getElementById('fKat').value,
        tags:      [...tags],
        foto1:     document.getElementById('fFoto1').value.trim(),
        foto2:     document.getElementById('fFoto2').value.trim(),
        foto3:     document.getElementById('fFoto3').value.trim(),
        foto4:     document.getElementById('fFoto4').value.trim(),
        foto5:     document.getElementById('fFoto5').value.trim(),
        demo:      document.getElementById('fDemo').value.trim(),
        github:    document.getElementById('fGithub').value.trim(),
      };

      if (editIndex >= 0) {
        proyek[editIndex] = data;
        toast('proyek diperbarui ✓');
      } else {
        proyek.push(data);
        toast('proyek ditambahkan ✓');
      }

      simpan();
      tutupForm();
    }

    function simpan() {
      localStorage.setItem('proyek', JSON.stringify(proyek));
      render();
    }

    // ── Tags ──
    document.getElementById('tagField').addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault();
        const val = e.target.value.trim().replace(',','');
        if (val && !tags.includes(val)) { tags.push(val); renderTags(); }
        e.target.value = '';
      }
      if (e.key === 'Backspace' && !e.target.value && tags.length) {
        tags.pop(); renderTags();
      }
    });

    function hapusTag(i) { tags.splice(i, 1); renderTags(); }

    function renderTags() {
      const container = document.getElementById('tagsInput');
      const input     = document.getElementById('tagField');
      container.querySelectorAll('.tag-chip').forEach(el => el.remove());
      tags.forEach((t, i) => {
        const chip = document.createElement('div');
        chip.className = 'tag-chip';
        chip.innerHTML = `${t}<button onclick="hapusTag(${i})">×</button>`;
        container.insertBefore(chip, input);
      });
    }

    // ── Preview foto ──
    function previewFoto(input, previewId) {
      const img = document.getElementById(previewId);
      if (input.value.trim()) {
        img.src = input.value.trim();
        img.classList.add('show');
        img.onerror = () => img.classList.remove('show');
      } else {
        img.classList.remove('show');
      }
    }

    // ── Toast ──
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2500);
    }

    // ── Init ──
    render();
  </script>
</body>
</html>
